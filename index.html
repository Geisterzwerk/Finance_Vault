<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!--
    Content-Security-Policy: Nur Code vom eigenen Ursprung darf laufen (kein Inline-Skript,
    kein eval, keine CDN). Netzwerk nur zu den bekannten Kurs-/Blockchain-APIs und zum
    eigenen Server über Tailscale (*.ts.net). Läuft dein Server unter einer anderen Adresse,
    hier bei connect-src ergänzen.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; media-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'self'; connect-src 'self' blob: data: https://api.coingecko.com https://api.frankfurter.dev https://mempool.space https://ethereum-rpc.publicnode.com https://api.avax.network https://api.mainnet-beta.solana.com https://xrplcluster.com https://fullnode.mainnet.sui.io https://rpc.mainnet.near.org https://api.kaspa.org https://rest.sei-apis.com https://api.hyperliquid.xyz https://rpc.hyperliquid.xyz https://*.ts.net http://localhost:8787 http://127.0.0.1:8787">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0C1626">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!--
    "black" statt "black-translucent": Bei "black-translucent" ragt die App unter die
    Statusleiste, und iOS berechnet die Höhe in der Home-Bildschirm-App teilweise falsch
    (Spalt unter der Tab-Leiste, verschobene Ansicht). Achtung: iOS liest diesen Wert nur
    beim Hinzufügen zum Home-Bildschirm -> App einmal entfernen und neu hinzufügen.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Finance Vault">
  <meta name="format-detection" content="telephone=no">
  <title>Finance Vault</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="row">
      <button id="back" class="link" type="button" hidden>‹ Zurück</button>
      <div class="brand grow">FINANCE VAULT</div>
      <button id="refresh" class="link" type="button" title="Kurse aktualisieren" aria-label="Kurse aktualisieren">↻</button>
      <a href="#/ziele" class="link" title="Ziele" aria-label="Ziele">◎</a>
    </div>
    <h1 id="title" class="serif"></h1>
    <div id="sub" class="sub"></div>
  </header>
  <main id="view"></main>
  <nav class="tabbar" aria-label="Hauptnavigation">
    <a href="#/"><i aria-hidden="true">◆</i>Übersicht</a>
    <a href="#/invest"><i aria-hidden="true">▲</i>Invest</a>
    <a href="#/steuern"><i aria-hidden="true">§</i>Steuern</a>
    <a href="#/rechnungen"><i aria-hidden="true">≡</i>Rechnungen</a>
    <a href="#/vault"><i aria-hidden="true">⬢</i>Vault</a>
  </nav>
  <div id="sheet-bg"></div>
  <section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head"><button id="sheet-back" class="link" type="button">Schliessen</button><b id="sheet-title" class="serif"></b><span></span></div>
    <div id="sheet-body"></div>
  </section>
  <div id="lock" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="print"></div>
  <noscript>Bitte JavaScript aktivieren.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
